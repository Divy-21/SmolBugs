<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A sensor clipped onto the machine sends its vibration over Bluetooth to a laptop that analyses it with a trained model; the cloud decides whether the machine is OK, shows every machine live on a dashboard, and sends a phone alert before it breaks."><style>.box{fill:#FFFFFF;stroke:#B4C0C9;stroke-width:1.25}
.box-alert{fill:#FFFFFF;stroke:#B8620E;stroke-width:2}
.ic{fill:none;stroke:#15202B;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
.ic-alert{stroke:#B8620E}
.arr{stroke:#15202B;stroke-width:2}
.arr-alert{stroke:#B8620E;stroke-width:2.5}
.ah{fill:#15202B}
.ah-alert{fill:#B8620E}
text{font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif}
.title{font-size:22px;font-weight:600;fill:#15202B}
.title-alert{font-size:22px;font-weight:600;fill:#B8620E}
.sub{font-size:14px;fill:#5B6B78}
.lab{font-family:'IBM Plex Mono', Consolas, monospace;font-size:13px;fill:#5B6B78}
.lab-alert{font-family:'IBM Plex Mono', Consolas, monospace;font-size:13px;font-weight:600;fill:#B8620E}</style><rect width="1200" height="420" fill="#EEF1F3"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
<marker id="ah-alert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-alert"/></marker>
</defs>
<rect x="40" y="126" width="210" height="168" rx="14" class="box"/>
<g class="ic"><rect x="125.0" y="172" width="40" height="28" rx="4"/><line x1="133.0" y1="200" x2="133.0" y2="206"/><line x1="145.0" y1="200" x2="145.0" y2="206"/><line x1="157.0" y1="200" x2="157.0" y2="206"/><polyline points="121.0,162 129.0,154 137.0,162 145.0,154 153.0,162 161.0,154 169.0,162"/></g>
<text x="145.0" y="238" class="title" text-anchor="middle">Sensor</text>
<text x="145.0" y="262" class="sub" text-anchor="middle">clips onto the machine</text>
<line x1="250" y1="210.0" x2="326" y2="210.0" class="arr" marker-end="url(#ah)"/><text x="288.0" y="198.0" class="lab" text-anchor="middle">Bluetooth</text>
<rect x="330" y="126" width="210" height="168" rx="14" class="box"/>
<g class="ic"><rect x="411.0" y="156" width="48" height="32" rx="3"/><path d="M403.0,196 L467.0,196 L461.0,188 L409.0,188 Z"/><polyline points="419.0,176 427.0,166 435.0,176 443.0,164 451.0,174"/></g>
<text x="435.0" y="238" class="title" text-anchor="middle">Analyse</text>
<text x="435.0" y="262" class="sub" text-anchor="middle">vibration pattern +</text>
<text x="435.0" y="280" class="sub" text-anchor="middle">trained ML model</text>
<line x1="540" y1="210.0" x2="616" y2="210.0" class="arr" marker-end="url(#ah)"/><text x="578.0" y="198.0" class="lab" text-anchor="middle">internet</text>
<rect x="620" y="126" width="210" height="168" rx="14" class="box"/>
<g class="ic"><path d="M703.0,194 a14,14 0 0 1 -2,-28 a18,18 0 0 1 34,-4 a13,13 0 0 1 14,16 a9,9 0 0 1 -2,16 Z"/><polyline points="717.0,180 723.0,186 735.0,172"/></g>
<text x="725.0" y="238" class="title" text-anchor="middle">Decide</text>
<text x="725.0" y="262" class="sub" text-anchor="middle">is this machine OK?</text>
<polyline points="830,180.0 900,180.0 900,112.0 946,112.0" class="arr" fill="none" marker-end="url(#ah)"/>
<text x="880" y="102.0" class="lab" text-anchor="end">live</text>
<rect x="950" y="28" width="210" height="168" rx="14" class="box"/>
<g class="ic"><rect x="1027.0" y="58" width="56" height="38" rx="3"/><line x1="1055.0" y1="96" x2="1055.0" y2="104"/><line x1="1043.0" y1="104" x2="1067.0" y2="104"/><line x1="1039.0" y1="88" x2="1039.0" y2="78"/><line x1="1051.0" y1="88" x2="1051.0" y2="68"/><line x1="1063.0" y1="88" x2="1063.0" y2="74"/><line x1="1073.0" y1="88" x2="1073.0" y2="66"/></g>
<text x="1055.0" y="140" class="title" text-anchor="middle">Dashboard</text>
<text x="1055.0" y="164" class="sub" text-anchor="middle">every machine, live</text>
<polyline points="830,240.0 900,240.0 900,308.0 946,308.0" class="arr-alert" fill="none" marker-end="url(#ah-alert)"/>
<text x="880" y="298.0" class="lab-alert" text-anchor="end">alert</text>
<rect x="950" y="224" width="210" height="168" rx="14" class="box-alert"/>
<g class="ic ic-alert"><rect x="1040.0" y="250" width="30" height="52" rx="5"/><line x1="1050.0" y1="295" x2="1060.0" y2="295"/><path d="M1077.0,258 a10,10 0 0 1 0,16 M1083.0,252 a18,18 0 0 1 0,28"/></g>
<text x="1055.0" y="336" class="title-alert" text-anchor="middle">Phone alert</text>
<text x="1055.0" y="360" class="sub" text-anchor="middle">before it breaks</text>
</svg>